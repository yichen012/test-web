     <!-- DM Swiper 與語言切換邏輯 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. 初始化 DM 的滑動效果，並存入變數 dmSwiper 中
            const dmSwiper = new Swiper(".dm-swiper", {
                loop: true,
                speed: 600,
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
            });

            // 2. 語言圈圈切換邏輯
            const langToggles = document.querySelectorAll('.lang-toggle');
            const downloadBtn = document.getElementById('dm-download-btn');

            // 這裡設定三種語言對應的 PDF 檔案路徑、按鈕文字，以及【預覽圖片陣列】
            const dmFiles = {
                tw: {
                    url: '../assets/img/dm/DM(ver_mandarin).pdf',
                    name: '澄乘科技_產品型錄_TW.pdf',
                    text: '下載型錄 (繁中)',
                    // 請換成繁體中文的圖片路徑
                    images: [
                        '../assets/img/dm/md1.jpg',
                        '../assets/img/dm/md2.jpg'
                    ]
                },
                en: {
                    url: '../assets/img/dm/DM(ver_en).pdf',
                    name: 'Lucid_Product_Catalog_EN.pdf',
                    text: 'Download (EN)',
                    // 請換成英文版的圖片路徑
                    images: [
                        '../assets/img/dm/en1.jpg',
                        '../assets/img/dm/en2.jpg'
                    ]
                },
                jp: {
                    url: '../assets/img/dm/DM(ver_jp).pdf',
                    name: 'Lucid_Product_Catalog_JP.pdf',
                    text: 'ダウンロード (JP)',
                    // 請換成日文版的圖片路徑
                    images: [
                        '../assets/img/dm/jp1.jpg',
                        '../assets/img/dm/jp2.jpg'
                    ]
                }
            };

            // 監聽圈圈點擊事件
            langToggles.forEach(toggle => {
                toggle.addEventListener('change', function() {
                    const selectedLang = this.value;
                    const fileInfo = dmFiles[selectedLang];
                    
                    if(fileInfo) {
                        // 步驟 A：換按鈕連結跟文字
                        downloadBtn.href = fileInfo.url;
                        downloadBtn.download = fileInfo.name;
                        downloadBtn.innerHTML = `<i class="bi bi-download"></i> ${fileInfo.text}`;

                        // 步驟 B：替換 Swiper 裡面的圖片
                        // 因為設定了 loop: true，Swiper 會產生重複的備用幻燈片，所以要抓出所有 slide 來替換
                        const slides = document.querySelectorAll('.dm-swiper .swiper-slide');
                        slides.forEach(slide => {
                            // Swiper 會給每個真實的幻燈片一個 data-swiper-slide-index (例如 0, 1, 2)
                            const realIndex = slide.getAttribute('data-swiper-slide-index');
                            if (realIndex !== null && fileInfo.images[realIndex]) {
                                const img = slide.querySelector('img');
                                if (img) {
                                    img.src = fileInfo.images[realIndex];
                                }
                            }
                        });

                        // 步驟 C：切換語言後，讓輪播自動跳回該語言的第一頁封面
                        dmSwiper.slideToLoop(0);
                    }
                });
            });
            const defaultToggle = document.querySelector('.lang-toggle:checked');
            if(defaultToggle) {
                defaultToggle.dispatchEvent(new Event('change'));
            }
        });
    </script>
